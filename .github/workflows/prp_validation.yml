name: PRP Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'prompts/**.yml'

jobs:
  validate-prp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: "Validate PRP files against schema"
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: RomanosTrechlis/actions-validate-yaml@master
        with:
          schema: schemas/prp_schema.yml
          data: ${{ steps.changed-files.outputs.all_changed_files }}
      - name: Install dependencies
        run: pip install yamllint check-jsonschema

      - name: Lint YAML files
        run: yamllint .

      - name: Validate PRP files
        run: |
          for f in prompts/*.yml; do
            check-jsonschema --schemafile schemas/prp_schema.yml "$f"
          done
