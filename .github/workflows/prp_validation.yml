name: PRP Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'prompts/**.yml'

permissions:
  contents: read

jobs:
  validate-prp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          # ⚡ Bolt Optimization:
          # Consolidate multiple changed-files steps into a single step using files_yaml.
          # This avoids redundant Git tree traversals and process starts.
          files_yaml: |
            prp:
              - 'prompts/**.yml'
            yaml:
              - '**/*.yml'
              - '**/*.yaml'
          diff_filter: ACMRT
          separator: ","

      - name: Set up Python
        if: steps.changed-files.outputs.prp_any_changed == 'true' || steps.changed-files.outputs.yaml_any_changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        if: steps.changed-files.outputs.prp_any_changed == 'true' || steps.changed-files.outputs.yaml_any_changed == 'true'
        run: |
          # 🛡️ Sentinel Security Enhancement:
          # Pin exact versions of CLI tools to prevent supply-chain attacks.
          # ⚡ Bolt Optimization:
          # Add --no-cache-dir and --disable-pip-version-check to reduce disk I/O and network overhead.
          pip install --no-cache-dir --disable-pip-version-check yamllint==1.38.0 check-jsonschema==0.37.1

      - name: "Validate PRP files against schema"
        if: steps.changed-files.outputs.prp_any_changed == 'true'
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.prp_all_changed_files }}
        run: |
          # ⚡ Bolt Optimization:
          # Batching files via xargs to avoid Python interpreter startup overhead inside loop.
          printf "%s" "$CHANGED_FILES" | xargs -r -d ',' check-jsonschema --schemafile schemas/prp_schema.yml --

      - name: Lint YAML files
        if: steps.changed-files.outputs.yaml_any_changed == 'true'
        env:
          ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.yaml_all_changed_files }}
        run: |
          # ⚡ Bolt Optimization:
          # Changed O(N) to O(C) where N=total files, C=changed files.
          # As the registry scales to 1000s of PRPs, linting everything on every PR
          # becomes a massive CI bottleneck. We now only lint what changed.
          # Further optimized by batching files via xargs to eliminate Python startup overhead per file.
          printf "%s" "$ALL_CHANGED_FILES" | xargs -r -d ',' yamllint --
