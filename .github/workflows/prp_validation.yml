name: PRP Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'prompts/**.yml'

permissions:
  contents: read

jobs:
  validate-prp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: prompts/**.yml
          diff_filter: ACMRT
          separator: ","

      - name: Get changed YAML files
        id: changed-yaml-files
        uses: tj-actions/changed-files@v44
        with:
          files: |
            **/*.yml
            **/*.yaml
          diff_filter: ACMRT
          separator: ","

      - name: Set up Python
        if: steps.changed-files.outputs.any_changed == 'true' || steps.changed-yaml-files.outputs.any_changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        if: steps.changed-files.outputs.any_changed == 'true' || steps.changed-yaml-files.outputs.any_changed == 'true'
        # ⚡ Bolt Optimization: Conditionally executing environment setup and dependencies only when files change to skip work early.
        run: pip install yamllint check-jsonschema

      - name: "Validate PRP files against schema"
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          # ⚡ Bolt Optimization:
          # Batching files via xargs to avoid Python interpreter startup overhead inside loop.
          printf "%s" "$CHANGED_FILES" | xargs -r -d ',' check-jsonschema --schemafile schemas/prp_schema.yml --

      - name: Lint YAML files
        if: steps.changed-yaml-files.outputs.any_changed == 'true'
        env:
          ALL_CHANGED_FILES: ${{ steps.changed-yaml-files.outputs.all_changed_files }}
        run: |
          # ⚡ Bolt Optimization:
          # Changed O(N) to O(C) where N=total files, C=changed files.
          # As the registry scales to 1000s of PRPs, linting everything on every PR
          # becomes a massive CI bottleneck. We now only lint what changed.
          # Further optimized by batching files via xargs to eliminate Python startup overhead per file.
          printf "%s" "$ALL_CHANGED_FILES" | xargs -r -d ',' yamllint --
