# CxEP-Promptware-Registry: PRP Validation Workflow
#
# This GitHub Actions workflow enforces Policy-as-Code (PaC) by validating
# any new or modified Product-Requirements Prompts (PRPs) against the formal
# schema defined in `schemas/prp_schema.yml`.

name: "PRP Validation"

on:
  push:
    branches:
      - main
    paths:
      - 'prompts/**.yml'
      - 'prompts/**.yaml'
  pull_request:
    paths:
      - 'prompts/**.yml'
      - 'prompts/**.yaml'

jobs:
  validate-prp:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Get changed PRP files"
        id: changed-files
        uses: tj-actions/changed-files@v41
        with:
          files: |
            prompts/**.yml
            prompts/**.yaml
          separator: "\n"

      - name: "Validate PRP files against schema"
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: RomanosTrechlis/actions-validate-yaml@v1
        with:
          schema: schemas/prp_schema.yml
          data: ${{ steps.changed-files.outputs.all_changed_files }}
