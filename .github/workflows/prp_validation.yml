name: PRP Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'prompts/**.yml'

permissions:
  contents: read

jobs:
  validate-prp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: prompts/**.yml

      - name: Install dependencies
        run: pip install yamllint check-jsonschema

      - name: "Validate PRP files against schema"
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          # ⚡ Bolt Optimization:
          # Changed from a bash `for` loop to passing all files directly to `check-jsonschema`.
          # This eliminates the O(C) Python interpreter startup overhead, making validation significantly faster.
          # We use xargs to securely parse the default space-separated output from tj-actions/changed-files.
          echo "$CHANGED_FILES" | xargs -r check-jsonschema --schemafile schemas/prp_schema.yml

      - name: Get changed YAML files
        id: changed-yaml-files
        uses: tj-actions/changed-files@v44
        with:
          files: |
            **/*.yml
            **/*.yaml
          diff_filter: ACMRT

      - name: Lint YAML files
        if: steps.changed-yaml-files.outputs.any_changed == 'true'
        env:
          ALL_CHANGED_FILES: ${{ steps.changed-yaml-files.outputs.all_changed_files }}
        run: |
          # ⚡ Bolt Optimization:
          # Changed O(N) to O(C) where N=total files, C=changed files.
          # As the registry scales to 1000s of PRPs, linting everything on every PR
          # becomes a massive CI bottleneck. We now only lint what changed.
          # Replaced bash `for` loop with batch processing to avoid Python startup overhead per file.
          echo "$ALL_CHANGED_FILES" | xargs -r yamllint
