# CxEP-Promptware-Registry: PRP Validation Workflow
#
# This GitHub Actions workflow enforces Policy-as-Code (PaC) by validating
# any new or modified Product-Requirements Prompts (PRPs) against the formal
# schema defined in `schemas/prp_schema.yml`.

name: "PRP Validation"

on:
  push:
    branches:
      - main
    paths:
      - 'prompts/**.yml'
      - 'prompts/**.yaml'
  pull_request:
    paths:
      - 'prompts/**.yml'
      - 'prompts/**.yaml'

jobs:
  validate-prp:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Set up Python"
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: "Install dependencies"
        run: pip install check-jsonschema

      - name: "Validate PRP files against schema"
        run: |
          for f in prompts/*.yml; do
            check-jsonschema --schemafile schemas/prp_schema.yml "$f"
          done
