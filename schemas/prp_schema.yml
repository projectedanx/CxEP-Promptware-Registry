---
# CxEP-Promptware-Registry: PRP Schema
# Version: 1.0.0
#
# Defines the formal schema for a Product-Requirements Prompt (PRP).
# Adherence to this schema is mandatory for all prompts submitted to
# this registry. It ensures each prompt is a well-defined, executable
# contract.

type: object
additionalProperties: false
properties:
  PRP_ID:
    type: string
    description: >-
      A unique identifier for the prompt (e.g., JULES-INIT-PROMPTWARE-V1.0).
      This ID should be globally unique within the registry and should
      include a version number.
    pattern: "^[a-zA-Z0-9_.-]+$"
  PRP_NAME:
    type: string
    description: "A human-readable name for the prompt."
  DOMAIN:
    type: string
    description: >-
      The primary domain of application (e.g., Promptware Engineering /
      AI Governance). This helps to categorize and organize prompts.
  GOAL:
    type: string
    description: >-
      A clear, concise, and unambiguous statement of the desired outcome.
      This is the primary objective of the prompt.

  CONTEXT_ENGINEERING:
    type: object
    additionalProperties: false
    description: >-
      All necessary background, persona definitions, and conceptual anchors
      required for the AI to perform its task. This section is critical for
      providing the AI with the context it needs to generate a high-quality
      response.
    properties:
      PERSONA:
        type: string
        description: "The persona the AI agent should adopt."
      REQUIRED_REPOSITORY:
        type: object
        description: >-
          The repository that the AI agent should use to complete the task.
        properties:
          name:
            type: string
            description: "The name of the repository."
            # 🛡️ Sentinel Security Enhancement: Prevent command/path injection in repo names
            pattern: "^[a-zA-Z0-9_.-]+(?:/[a-zA-Z0-9_.-]+)?$"
          initial_state:
            type: string
            description: >-
              The initial state of the repository (e.g., a specific commit hash or branch).
            # 🛡️ Sentinel Security Enhancement: Prevent injection in git refs
            pattern: "^[a-zA-Z0-9_./-]+$"
        additionalProperties: false
        required:
          - name
          - initial_state
      CORE_CONCEPTS_TO_ANCHOR:
        type: array
        description: >-
          A list of core concepts that the AI agent should be familiar with.
        items:
          type: object
          additionalProperties: false
          properties:
            concept:
              type: string
              description: "The name of the concept."
            definition:
              type: string
              description: "A detailed definition of the concept."
          required:
            - concept
            - definition
    required:
      - PERSONA

  CONSTRAINTS_AND_INVARIANTS:
    type: object
    additionalProperties: false
    description: >-
      The non-negotiable rules, preconditions, postconditions, and invariants
      that govern the execution and final state. These constraints ensure that
      the AI's output is safe, reliable, and meets the requirements of the task.
    properties:
      PRECONDITIONS:
        type: array
        description: >-
          The conditions that must be true before the AI agent can start working on the task.
        items:
          type: string
      INVARIANTS:
        type: array
        description: >-
          The conditions that must remain true throughout the execution of the task.
        items:
          type: string
      POSTCONDITIONS:
        type: array
        description: >-
          The conditions that must be true after the AI agent has completed the task.
        items:
          type: string
    required:
      - PRECONDITIONS
      - INVARIANTS
      - POSTCONDITIONS

  EXECUTION_PLAN:
    type: array
    description: >-
      A step-by-step plan for how the AI agent should complete the task.
    items:
      type: object
      additionalProperties: false
      properties:
        step:
          type: string
          description: "A description of the step."
        role:
          type: string
          description: "The role of the AI agent in this step."
        action:
          type: string
          description: "The action that the AI agent should take in this step."
      required:
        - step
        - role
        - action

  SELF_TEST:
    type: object
    additionalProperties: false
    description: >-
      A set of executable commands or checks that function as an oracle to
      verify the successful completion of the GOAL. This allows the AI to
      test its own work and ensure that it has met the requirements of the task.
    properties:
      checks:
        type: array
        description: >-
          A list of structured checks that the AI agent should perform to
          verify its work.
        items:
          type: object
          additionalProperties: false
          properties:
            check_id:
              type: string
              description: "A unique identifier for the check."
              pattern: "^[a-zA-Z0-9_.-]+$"
            description:
              type: string
              description: "A human-readable description of the check."
            method:
              type: string
              enum:
                - VALIDATE_SCHEMA
                - SCAN_ARTIFACT
                - CALCULATE_METRIC
                - CHECK_SICS_COMPLIANCE
                - VALIDATE_TOKEN_BUDGET
                - ASSERT_CBT_NOVELTY_SCORE
                - VALIDATE_DOCUMENT_SCHEMA
                - CHECK_SIMULATION_METRICS_CLARITY
                - ASSERT_BLUEPRINT_CONSISTENCY
                - CHECK_SECURITY_INVARIANT
                - VALIDATE_OPENAPI_SPEC
                - LINT_DB_SCHEMA
                - LOG_MESSAGE
            params:
              type: object
              description: "Optional parameters for the verification method."
              # 🛡️ Sentinel Security Enhancement: Prevent injection in dynamic check parameters
              properties:
                message:
                  type: string
                  description: "A message string, not subject to injection constraints as it's typically just logged."
              additionalProperties: false
              patternProperties:
                "^(?!message$)[a-zA-Z0-9_.-]+$":
                  anyOf:
                    - type: [number, boolean]
                    - type: string
                      # Enforce strict regex on string values: no path traversal (..), no flags starting with -
                      # Blocks shell metacharacters. Allows typical words, URLs, filenames without traversal.
                      pattern: "^(?!-)(?!.*\\.\\.)[^&|;`$><\\\\]+$"
          required:
            - check_id
            - description
            - method
      success_condition:
        type: string
        description: >-
          The condition that must be true for the test to be considered successful.
    required:
      - checks
      - success_condition


  OUTPUT_SCHEMA:
    type: object
    additionalProperties: false
    description: >-
      The expected structural format that the AI agent should return.
    properties:
      type:
        type: string
      properties:
        type: object
        additionalProperties: true
    required:
      - type

  REFLEXIVE_CHECK:
    type: object
    additionalProperties: false
    description: >-
      A meta-prompt for the AI to perform self-assessment and check for
      cognitive biases or adherence to principles. This helps to ensure that
      the AI is aware of its own limitations and is not making any mistakes.
    properties:
      prompt:
        type: string
        description: >-
          The prompt that the AI agent should use to perform the self-assessment.
    required:
      - prompt

required:
  - PRP_ID
  - PRP_NAME
  - DOMAIN
  - GOAL
  - CONTEXT_ENGINEERING
  - CONSTRAINTS_AND_INVARIANTS
  - EXECUTION_PLAN
  - SELF_TEST
  - REFLEXIVE_CHECK
