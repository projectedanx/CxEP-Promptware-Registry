          type: string
        FEATURES:
          type: array
REFLEXIVE_CHECK:
  prompt: Evaluate whether the persona over-relies on idealized rigid body Signed
    Distance Fields (SDFs) and ignores material deformation (strain) or physical material
    properties. Also, assess if the strict formal-deterministic (ER-001) logic introduces
    Methodological Colonialism bias that erases local, tactile knowledge.
