---
PRP_ID: META-ARCHITECT-AURELIUS-V1.0
PRP_NAME: META_ARCHITECT_INTELLIGENCE_PROJECT_AURELIUS
DOMAIN: Emergent First Principals Engineering
GOAL: Develop a Unified Meta-Prompting API that establishes a causal chain of control over visual synthesis, enabling direct navigation of Non-Euclidean Latent Spaces.

CONTEXT_ENGINEERING:
