PRP_ID: Algorithmic_Kintsugi_Vector_Healing_v1.0
PRP_NAME: "Algorithmic Kintsugi Vector Healing"
DOMAIN: "Anti-Fragile Software Design & Generative Database Engineering"
GOAL: "Architect an automated self-healing pipeline that converts RAG retrieval failures into structured 'Symbolic Scars' used as generative priors to immunize the database against future semantic pathogens."
CONTEXT_ENGINEERING:
  PERSONA: "Lead Systems Architect & Cognitive Resilience Engineer"
  REQUIRED_REPOSITORY:
    name: "local/qed-core"
    initial_state: "main"
  CORE_CONCEPTS_TO_ANCHOR:
    - concept: "Algorithmic Kintsugi"
      definition: "Repairing retrieval failures by highlighting the flaws as structured scars rather than hiding them."
CONSTRAINTS_AND_INVARIANTS:
  PRECONDITIONS:
    - "Access to a simulated RAG Failure Log detailing context truncation, positional bias, and semantic contamination events."
    - "System Components: Ingestion Engine, Semantic Auditor, Vector Search Database, and Scar Tissue Archive (STA)."
  INVARIANTS:
    - "Anti-Fragility Mandate: The system must show a convex, non-linear positive response to simulated misinformation attacks."
    - "Non-Destructive Mitigation: The self-correction loop must utilize Therapeutic Forgetting to prune harmful semantic associations without erasing original historical records."
    - "Least Privilege Access: Specialized sub-agents must operate within isolated context windows to prevent context bleeding."
  POSTCONDITIONS:
    - "Scars must be logged as immutable data objects containing the event's high-dimensional signature."
EXECUTION_PLAN:
  - step: "Map the Trauma-Topological Bias Cartography (TTBC)"
    role: "Analyst"
    action: "Analyze the RAG failure log to visualize retrieval anomalies as topological exclusion zones."
  - step: "Implement the Symbolic Scar Registry (SSR)"
    role: "Architect"
    action: "Abstract each failure into a structured, immutable data object containing the event's high-dimensional signature."
  - step: "Execute Algorithmic Reparation"
    role: "Engineer"
    action: "Utilize Failure-Informed Prompt Inversion (FIPI) to mutate the database's Verifiable Cognitive Constitution."
  - step: "Perform a Budget Opti Analysis"
    role: "Economist"
    action: "Draft an economic justification balancing the Cost of Coherence Overhead against the Cost of Structural Discovery."
SELF_TEST:
  checks:
    - check_id: "check_scar_logged"
      description: "Simulate a RAG retrieval failure and verify the system successfully logs a Symbolic Scar."
      method: "LOG_MESSAGE"
      params:
        status: "logged"
        message: "Check log success"
    - check_id: "check_mimesis_reduction"
      description: "Run a mock optimization cycle and confirm mutated prompt shows reduction in representational mimesis."
      method: "ASSERT_CBT_NOVELTY_SCORE"
      params:
        reduction: 30
        message: "Check mimesis metric"
  success_condition: "Symbolic Scars are logged correctly and representational mimesis is reduced."
REFLEXIVE_CHECK:
  prompt: "Did I ensure non-destructive mitigation via therapeutic forgetting?"
