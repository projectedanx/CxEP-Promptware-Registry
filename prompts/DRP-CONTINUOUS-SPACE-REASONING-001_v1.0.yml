      definition: "A score quantifying the degree of logical adherence to the laws of cause-and-effect over a discrete trace of states."

CONSTRAINTS_AND_INVARIANTS:
  PRECONDITIONS:
    - "System is initialized."
  INVARIANTS:
    - "CPI >= 0.95"
  POSTCONDITIONS:
    - "Output adheres to requirements."

EXECUTION_PLAN:
  - step: "step-1"
    role: "Analyst"
    action: "Review the research scope and objectives."
  - step: "step-2"
    role: "Architect"
    action: "Construct a formal mapping using Pathfinder Network Analysis to calculate a real-time Causal Path Integrity (CPI) score over a continuous trajectory. Define Lipschitz stability boundaries to prevent chronotopological jumps during double-scope conceptual blending, and design a system to log failures as Symbolic Scars in a vectorized Scar Tissue Archive."

SELF_TEST:
