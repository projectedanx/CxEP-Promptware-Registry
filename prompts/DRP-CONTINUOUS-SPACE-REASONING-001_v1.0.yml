    - check_id: "verify-schema"
      description: "Ensure output schema compliance."
      method: VALIDATE_SCHEMA
      params:
        message: "Validating schema."
  success_condition: "All tests pass without errors."

OUTPUT_SCHEMA:
  type: "object"
  properties:
    result:
      type: "object"

REFLEXIVE_CHECK:
  prompt: "Does this solution address all mathematical constraints required by the prompt?"
